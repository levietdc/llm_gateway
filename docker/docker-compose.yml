version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: ai-gateway-redis
    ports:
      - "6379:6379"   # Redis Port
      - "8001:8001"   # RedisInsight UI Port
    volumes:
      - redis_data:/data
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ai-gateway-phoenix
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC collector
      - "4318:4318"   # OTLP HTTP collector
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-gateway-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ai-gateway-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ai-gateway-app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:4317
    env_file:
      - ../.env
    depends_on:
      - redis
      - phoenix
    restart: unless-stopped

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
